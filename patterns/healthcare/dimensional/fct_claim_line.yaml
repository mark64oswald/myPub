pattern_id: healthcare.dimensional.fct_claim_line
name: Claim Line Fact Table
version: "1.0"
domain: healthcare
category: dimensional

description: |
  Fact table for healthcare claims at the claim line grain.
  Each row represents a single service/procedure on a claim.
  This is the foundational fact table for claims analytics.

problem_statement: |
  Healthcare organizations need to analyze claims data for cost management,
  utilization analysis, provider performance, and quality measurement.
  The challenge is modeling claims to support diverse analytical needs
  while maintaining data integrity and query performance.

sources:
  - book: "The Data Warehouse Toolkit (3rd Edition)"
    chapter: "Chapter 11: Healthcare"
    authors: ["Ralph Kimball", "Margy Ross"]
    authority: high
    contribution: canonical
    notes: "Primary source for healthcare dimensional modeling patterns"

context:
  when_to_use:
    - Claims analytics and reporting
    - Provider performance analysis
    - Cost and utilization studies
    - Quality measure calculation (HEDIS, Stars)
    - Risk adjustment analytics
    - Network analysis
    
  when_not_to_use:
    - Real-time claims adjudication
    - OLTP/transactional systems
    - When only header-level aggregates needed
    - Pre-adjudicated claims processing

  prerequisites:
    - dimensional_modeling
    - fact_table
    - healthcare_claims_domain

schema:
  grain: "One row per claim line (individual service/procedure)"
  
  primary_key:
    name: claim_line_key
    type: BIGINT
    generation: surrogate_sequence
    description: "Surrogate key for the claim line"
  
  foreign_keys:
    - name: member_key
      references: dim_member(member_key)
      role: patient
      required: true
      
    - name: rendering_provider_key
      references: dim_provider(provider_key)
      role: rendering_provider
      required: true
      
    - name: billing_provider_key
      references: dim_provider(provider_key)
      role: billing_provider
      required: false
      
    - name: facility_key
      references: dim_provider(provider_key)
      role: service_facility
      required: false
      
    - name: service_date_key
      references: dim_date(date_key)
      role: date_of_service
      required: true
      
    - name: paid_date_key
      references: dim_date(date_key)
      role: payment_date
      required: false
      
    - name: procedure_key
      references: dim_procedure(procedure_key)
      role: primary_procedure
      required: true
      
    - name: primary_diagnosis_key
      references: dim_diagnosis(diagnosis_key)
      role: primary_diagnosis
      required: false
      notes: "See variations for handling multiple diagnoses"

  degenerate_dimensions:
    - name: claim_id
      type: VARCHAR(50)
      description: "Source system claim identifier"
      
    - name: claim_line_number
      type: INTEGER
      description: "Line number within the claim"
      
    - name: place_of_service_code
      type: VARCHAR(2)
      description: "CMS place of service code"
      
    - name: type_of_bill
      type: VARCHAR(4)
      description: "UB-04 type of bill (institutional claims)"

  measures:
    - name: charge_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Billed/submitted amount"
      
    - name: allowed_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Contracted allowed amount"
      
    - name: paid_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Amount paid by payer"
      
    - name: member_liability
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Member cost sharing (copay + coinsurance + deductible)"
      
    - name: copay_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Member copay amount"
      
    - name: coinsurance_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Member coinsurance amount"
      
    - name: deductible_amount
      type: DECIMAL(12,2)
      aggregation: SUM
      description: "Amount applied to deductible"
      
    - name: units
      type: DECIMAL(8,2)
      aggregation: SUM
      description: "Service units"
      
    - name: days
      type: INTEGER
      aggregation: SUM
      description: "Days (for inpatient)"

template:
  sql: |
    CREATE TABLE fct_claim_line (
        -- Surrogate key
        claim_line_key BIGINT PRIMARY KEY,
        
        -- Foreign keys to dimensions
        member_key BIGINT NOT NULL,
        rendering_provider_key BIGINT NOT NULL,
        billing_provider_key BIGINT,
        facility_key BIGINT,
        service_date_key INTEGER NOT NULL,
        paid_date_key INTEGER,
        procedure_key BIGINT NOT NULL,
        primary_diagnosis_key BIGINT,
        
        -- Degenerate dimensions
        claim_id VARCHAR(50) NOT NULL,
        claim_line_number INTEGER NOT NULL,
        place_of_service_code VARCHAR(2),
        type_of_bill VARCHAR(4),
        
        -- Measures
        charge_amount DECIMAL(12,2),
        allowed_amount DECIMAL(12,2),
        paid_amount DECIMAL(12,2),
        member_liability DECIMAL(12,2),
        copay_amount DECIMAL(12,2),
        coinsurance_amount DECIMAL(12,2),
        deductible_amount DECIMAL(12,2),
        units DECIMAL(8,2),
        days INTEGER,
        
        -- Audit columns
        source_system VARCHAR(50),
        source_claim_line_id VARCHAR(100),
        loaded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP
    );
    
    -- Performance indexes
    CREATE INDEX idx_fcl_member ON fct_claim_line(member_key);
    CREATE INDEX idx_fcl_provider ON fct_claim_line(rendering_provider_key);
    CREATE INDEX idx_fcl_service_date ON fct_claim_line(service_date_key);
    CREATE INDEX idx_fcl_procedure ON fct_claim_line(procedure_key);
    CREATE INDEX idx_fcl_claim ON fct_claim_line(claim_id);

test_cases:
  - name: total_paid_by_year
    description: "Calculate total paid amount by year"
    query: |
      SELECT 
          d.calendar_year,
          SUM(f.paid_amount) as total_paid
      FROM fct_claim_line f
      JOIN dim_date d ON f.service_date_key = d.date_key
      GROUP BY d.calendar_year
      ORDER BY d.calendar_year
      
  - name: pmpm_by_month
    description: "Calculate per-member-per-month cost"
    query: |
      SELECT 
          d.year_month,
          SUM(f.paid_amount) / COUNT(DISTINCT f.member_key) as pmpm
      FROM fct_claim_line f
      JOIN dim_date d ON f.service_date_key = d.date_key
      GROUP BY d.year_month
      ORDER BY d.year_month
      
  - name: top_procedures
    description: "Top 10 procedures by paid amount"
    query: |
      SELECT 
          p.procedure_code,
          p.procedure_description,
          SUM(f.paid_amount) as total_paid,
          COUNT(*) as claim_lines
      FROM fct_claim_line f
      JOIN dim_procedure p ON f.procedure_key = p.procedure_key
      GROUP BY p.procedure_code, p.procedure_description
      ORDER BY total_paid DESC
      LIMIT 10

related_patterns:
  - healthcare.dimensional.dim_member
  - healthcare.dimensional.dim_provider
  - healthcare.dimensional.dim_diagnosis
  - healthcare.dimensional.dim_procedure
  - healthcare.reference.dim_date
  - healthcare.metrics.pmpm
  - healthcare.metrics.mlr
