[project]
name = "mypub"
version = "2.0.0.dev0"
description = "Claude-native knowledge base over technical ePubs and live docs, with a Skills Factory."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mark Oswald" }]

dependencies = [
    "duckdb>=1.1.0",
    "sentence-transformers>=3.0.0",
    "fastmcp>=0.2.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
