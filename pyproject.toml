[project]
name = "mypub"
version = "2.0.0.dev0"
description = "Claude-native knowledge base over technical ePubs and live docs, with a Skills Factory."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mark Oswald" }]

dependencies = [
    "duckdb==1.5.0",  # pinned: DuckPGQ community extension is broken on 1.5.1, absent on 1.5.2
    "sentence-transformers>=3.0.0",
    "fastmcp>=3.0,<4",  # 0.2.x had an incompatible API; 3.x is the standalone package (`from fastmcp import FastMCP`)
    "markdown-it-py>=3.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.7.0",
    "psutil>=5.9.0",  # Phase 4.4: cross-process lock-holder detection in refresh_docs.py
    "mcp>=1.0.0",     # Phase 4.4: Python MCP client for Context7 + DeepWiki fetchers
]
# The anthropic SDK is deliberately NOT a dependency — v2's cost model runs
# all LLM reasoning through Claude Code sub-agents (Task tool), covered by
# the Max subscription. See docs/mypub-v2-execution-plan.md "Cost model".

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
healthcare = [
    # Used by mcp-servers/kb-mcp/healthcare_libs/* — production reference
    # implementations the healthcare interop generators emit code against.
    # Install with: pip install -e ".[healthcare]"
    "pyx12>=2.3.3",          # X12 EDI parser (270/271, 834, 835, 837, 999)
    "hl7apy>=1.3.5",         # HL7 v2 parser + builder
    "fhir.resources>=7.1.0", # FHIR R4/R5 resource builders + validation
    "pydicom>=2.4.0",        # DICOM Part 10 parser + de-identification
    "PyYAML>=6.0",           # FHIR IG sushi-config.yaml validation in tests
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
